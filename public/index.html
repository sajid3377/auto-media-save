<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Media Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f8f9fa; color: #333; text-align: center; padding: 20px; }
    
    .header { margin-top: 30px; margin-bottom: 20px; }
    .logo-icon { width: 90px; height: 90px; margin-bottom: 10px; }
    h1 { font-size: 32px; font-weight: bold; color: #222; margin-bottom: 25px; }

    .download-container {
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      border: 3px solid #8ec63f;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .input-box {
      flex: 1;
      padding: 16px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    .quality-select {
      padding: 10px 12px;
      border-left: 1px solid #eee;
      font-size: 14px;
    }

    .btn-submit {
      background-color: #8ec63f;
      color: #fff;
      border: none;
      padding: 12px 18px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:hover { background-color: #7ab332; }

    .info-text { margin-top: 15px; font-size: 13px; color: #666; }

    #result { margin-top: 30px; }
    .media-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .media-card video, .media-card img { max-width: 100%; border-radius: 6px; }
    .dl-btn {
      display: inline-block;
      margin-top: 15px;
      background: #8ec63f;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .loader { padding: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="#8ec63f">
      <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
    </svg>
    <h1>Auto Media Save</h1>
  </div>

  <form id="downloadForm">
    <div class="download-container">
      <input type="url" id="mediaUrl" class="input-box" placeholder="پیسٹ کریں میڈیا کا لنک یہاں..." required>
      <select id="quality" class="quality-select" aria-label="Quality">
        <option value="auto">Auto</option>
        <option value="480">480p</option>
        <option value="720">720p (HD)</option>
        <option value="1080">1080p (Full HD)</option>
        <option value="original">Original</option>
      </select>
      <button type="submit" class="btn-submit">➔</button>
    </div>
  </form>

  <p class="info-text">آپ کی کنفیگریشن سرور سائیڈ (Vercel Environment Variables) میں رکھی جاتی ہے — خفیہ کلیدیں عوامی جگہ پر نہ ڈالیں۔</p>

  <div id="result"></div>

  <script>
    const resultDiv = document.getElementById('result');
    const setLoading = (msg = 'تلاش کیا جا رہا ہے، براہ کرم انتظار کریں...') => {
      resultDiv.innerHTML = `<div class="media-card loader">${msg}</div>`;
    };

    const showError = (msg) => {
      resultDiv.innerHTML = `<div class="media-card" style="color:#d9534f;">${msg}</div>`;
    };

    const showMedia = (data) => {
      const mediaUrl = data && (data.url || data.result || data.media || (data.data && data.data.url) || (data.raw && (data.raw.url || data.raw.result)));
      if (!mediaUrl) return showError('میڈیا لنک موصول نہیں ہوا — براہ کرم دوبارہ کوشش کریں۔');

      const isVideo = /\.(mp4|webm|mkv|mov)(\?|$)/i.test(mediaUrl);
      resultDiv.innerHTML = `
        <div class="media-card">
          <h3>میڈیا تیار ہے!</h3>
          ${isVideo ? `<video controls src="${mediaUrl}"></video>` : `<img src="${mediaUrl}" alt="media"/>`}
          <a href="${mediaUrl}" target="_blank" class="dl-btn" download>ڈاؤن لوڈ کریں</a>
        </div>
      `;
    };

    document.getElementById('downloadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('mediaUrl').value.trim();
      const quality = document.getElementById('quality').value;

      if (!url) return showError('براہ کرم ایک صحیح URL درج کریں۔');

      setLoading();

      try {
        const response = await fetch(`/api/download?url=${encodeURIComponent(url)}&quality=${encodeURIComponent(quality)}`);
        if (!response.ok) {
          const err = await response.json().catch(() => null);
          return showError(err && err.error ? err.error : 'سرور سے غلطی موصول ہوئی۔');
        }

        const data = await response.json();
        showMedia(data);
      } catch (err) {
        showError('سرور سے رابطہ ناکام — براہ کرم دوبارہ کوشش کریں۔');
        console.error('Fetch error:', err);
      }
    });
  </script>

</body>
</html>
